<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test bouton MonCash – NOVACC</title>
<style>
  :root {
    --purple: #a435f0;
    --purple-dark: #8710d8;
    --ink: #1c1d1f;
    --muted: #6a6f73;
    --bg: #ffffff;
    --card: #f7f9fa;
    --line: #d1d7dc;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f7f9fa; --muted: #b4bcc2; --bg: #1c1d1f; --card: #2d2f31; --line: #3e4143;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f7f9fa; --muted: #b4bcc2; --bg: #1c1d1f; --card: #2d2f31; --line: #3e4143;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5; padding: 24px 16px;
  }
  main { max-width: 440px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
  .row span:first-child { color: var(--muted); }
  .btn {
    display: block; width: 100%; text-align: center; text-decoration: none;
    background: var(--purple); color: #fff; font-weight: 700; font-size: 1rem;
    padding: 14px 16px; border: 0; border-radius: 4px; cursor: pointer;
  }
  .btn:hover { background: var(--purple-dark); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .btn.alt { background: transparent; color: var(--purple); border: 1px solid var(--purple); margin-top: 10px; }
  label { display: block; font-weight: 700; margin-bottom: 6px; }
  input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 4px; font: inherit; background: var(--bg); color: var(--ink); }
  #msg { margin-top: 12px; font-size: .9rem; color: var(--muted); min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <h1>Payer avec MonCash</h1>
  <p class="sub">Page de test – certificat NOVACC</p>

  <div class="card">
    <div class="row"><span>Montant</span><span><strong>300 HTG</strong></span></div>
    <div class="row"><span>Numéro marchand</span><span><strong>À renseigner</strong></span></div>
  </div>

  <a id="btnMoncash" class="btn" href="#">Ouvrir MonCash</a>
  <a id="btnPlay" class="btn alt" href="#">Page de l’application (Play Store)</a>
  <div id="msg" role="status"></div>

  <div class="card" style="margin-top:20px">
    <label for="txid">ID de transaction</label>
    <input id="txid" type="text" inputmode="text" placeholder="Saisis l’ID reçu après le paiement" autocomplete="off">
  </div>
</main>

<script>
  var PACKAGE = "com.useboom.htwallet";
  var PLAY_URL = "https://play.google.com/store/apps/details?id=" + PACKAGE + "&hl=fr";
  var msg = document.getElementById("msg");
  var isAndroid = /android/i.test(navigator.userAgent);

  document.getElementById("btnPlay").href = PLAY_URL;
  document.getElementById("btnPlay").target = "_blank";
  document.getElementById("btnPlay").rel = "noopener";

  document.getElementById("btnMoncash").addEventListener("click", function (e) {
    e.preventDefault();
    if (isAndroid) {
      msg.textContent = "Ouverture de MonCash…";
      window.location.href = "intent://#Intent;package=" + PACKAGE +
        ";S.browser_fallback_url=" + encodeURIComponent(PLAY_URL) + ";end";
    } else {
      msg.textContent = "Ce bouton fonctionne sur Android. Ouvre cette page sur ton téléphone.";
    }
  });
</script>
</body>
</html>
