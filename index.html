<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trafik</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F0;--card:#FFFFFF;--ink:#1B2024;--mute:#66707A;--line:#E3E5DF;--main:#1B2B3A;--on:#FFFFFF;--acc:#E0A100;--g:#2A8A5B;--y:#E0A100;--r:#C93C3C;--n:#8A939A;--soft:#EAECE6;--sh:0 1px 2px rgba(20,30,40,.06),0 6px 18px rgba(20,30,40,.06);--rad:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F1418;--card:#192026;--ink:#E9EDEF;--mute:#9AA6AE;--line:#2A343C;--main:#3A5B78;--g:#46B982;--y:#F2B91F;--r:#EE6A6A;--soft:#222C33;--acc:#F2B91F;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F1418;--card:#192026;--ink:#E9EDEF;--mute:#9AA6AE;--line:#2A343C;--main:#3A5B78;--g:#46B982;--y:#F2B91F;--r:#EE6A6A;--soft:#222C33;--acc:#F2B91F;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
#app{max-width:760px;margin:0 auto}
.top{position:sticky;top:0;z-index:20;background:var(--main);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none}
.logo svg{width:28px;height:28px}
h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em;line-height:1.1}
.sub{color:rgba(255,255,255,.75);font-size:12.5px;line-height:1.2;margin-top:2px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5BE3A0;margin-right:5px;box-shadow:0 0 0 3px rgba(91,227,160,.25)}
.authbar{display:flex;align-items:center;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:800;font-size:15px;border-radius:12px;padding:0 16px;min-height:44px;text-decoration:none;border:2px solid transparent;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.85)}
.btn.primary{background:var(--acc);color:#2b2000}
.btn.sm{min-height:36px;font-size:13px;padding:0 12px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#2b2000;display:grid;place-items:center;font-weight:800}
main{padding:6px 16px 24px}
.hero{background:linear-gradient(135deg,var(--main),#2f5273);color:#fff;border-radius:var(--rad);padding:16px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:var(--sh)}
.hero b{font-size:17px;display:block}
.hero span{font-size:13.5px;opacity:.85}
.hero .btns{display:flex;gap:8px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sum div{border-radius:16px;padding:12px 6px;color:#fff;text-align:center;font-weight:800;font-size:28px;line-height:1.1;box-shadow:var(--sh)}
.sum span{display:block;font-size:12px;font-weight:600;margin-top:2px}
.hd{color:#fff;font-weight:700;text-align:center}
.hl{height:1px;background:#fff;margin:16px 0 0}
:root[data-theme="light"] .hd{color:var(--ink)}
:root[data-theme="light"] .hl{background:var(--ink)}
.l0{background:var(--g)}.l1{background:var(--y);color:#2b2000!important}.l2{background:var(--r)}.l3{background:var(--n)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--card);color:var(--ink);padding:8px 16px;min-height:40px;font-size:14px;border:1px solid var(--line);border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--main);color:var(--on);border-color:var(--main)}
.list{display:grid;gap:10px;margin-top:10px}
.seg{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;box-shadow:var(--sh)}
.bar{width:8px;flex:none}
.seg .b{flex:1;padding:12px 0;min-width:0}
.seg h3{margin:0 0 2px;font-size:15.5px;font-weight:600;line-height:1.25}
.st{font-weight:800}
.s0{color:var(--g)}.s1{color:var(--y)}.s2{color:var(--r)}.s3{color:var(--n)}
.mute{color:var(--mute);font-size:13.5px}
.seg .a{padding:10px 10px 10px 0;display:flex;align-items:center}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink);margin-top:4px}
.pill.r{background:var(--r);color:#fff}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 14px;background:var(--main);color:var(--on);cursor:pointer;min-height:44px;transition:transform .08s}
button:active{transform:scale(.97)}
button.alt{background:var(--soft);color:var(--ink)}
button.on{background:var(--main);color:var(--on)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
select,input{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-top:12px;box-shadow:var(--sh)}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 6px;font-weight:600}
.big{display:grid;gap:10px;margin-top:14px}
.big button{display:flex;align-items:center;gap:12px;font-size:18px;padding:18px 16px;color:#fff;text-align:left;border-radius:16px;min-height:60px}
.big .l1{color:#2b2000}
h2{font-size:20px;font-weight:800;margin:18px 0 0;letter-spacing:-.01em}
.al{padding:10px 0;border-bottom:1px solid var(--line)}
.al:last-child{border:0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
nav div{max-width:760px;margin:0 auto;display:flex}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:8px 2px 6px;font-size:11.5px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--acc)}
.fb{display:flex;gap:6px;margin-top:10px}
.fb button{flex:1;padding:8px 4px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92%;text-align:center;z-index:50;box-shadow:var(--sh)}
#toast.show{opacity:1}
@media (min-width:720px){.list{grid-template-columns:1fr 1fr}.big{grid-template-columns:repeat(3,1fr)}.big button{flex-direction:column;text-align:center;justify-content:center}main{padding:6px 24px 24px}}
@media (max-width:520px){.top-in{flex-wrap:nowrap}.top .btn{min-height:40px;padding:0 12px;font-size:14px}.authbar{gap:6px}.brand .sub{display:none}h1{font-size:18px}.logo{width:36px;height:36px}.seg .a{padding:8px 8px 8px 0}.seg .a button{min-height:38px;padding:6px 12px;font-size:13px;width:100%}}
@media (max-width:360px){.top .btn{padding:0 9px;font-size:13px}.brand{gap:8px}}
@media (prefers-reduced-motion:reduce){#toast,button{transition:none}}
.tog{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-top:12px;gap:4px}
.tog button{flex:1;background:none;color:var(--mute);min-height:40px}
.tog button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--rad);padding:16px;text-align:left;box-shadow:var(--sh);min-height:112px}
.tile svg{width:30px;height:30px;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.tile b{font-size:17px}.tile span{font-size:13px;color:var(--mute);font-weight:500}
@media (min-width:720px){.grid2{grid-template-columns:repeat(4,1fr)}}
.cta{width:100%;margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(135deg,var(--acc),#f0b92a);color:#2b2000;border-radius:var(--rad);padding:18px;min-height:76px;box-shadow:var(--sh)}
.cta b{font-size:18px}.cta span{font-size:14px;font-weight:600;opacity:.8}
.sep{display:flex;align-items:center;gap:12px;margin:26px 0 14px;color:var(--mute);font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.sep span{display:flex;align-items:center;gap:7px}.sep span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px rgba(42,138,91,.2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);margin-top:14px;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;padding:12px 8px 8px 16px}
.ph b{font-size:17px;font-weight:800}
.seg{scroll-margin-top:90px}
.seg.pin{outline:3px solid var(--r);outline-offset:-3px;border-radius:var(--rad)}
.sb{margin-top:12px}.sb input{padding-left:14px}
.pinb{flex:none;width:auto;min-width:40px;min-height:40px;padding:0 8px;margin:0 12px 0 8px;font-size:16px;line-height:1}
.pinb[aria-pressed="true"]{background:var(--main);color:var(--on);border-color:var(--main)}
.lwrap{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;isolation:isolate;background:var(--soft);min-height:360px}
#lmap{height:62vh;min-height:360px;width:100%}
.leaflet-container{font-family:inherit}
.dd>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;min-height:48px;cursor:pointer;font-size:17px;font-weight:800}
.dd>summary::-webkit-details-marker{display:none}
.dd .cnt{display:inline-block;margin-left:8px;min-width:22px;padding:1px 8px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:700;text-align:center}
.dd .cnt.rd{background:#C93C3C;color:#fff}
.clamp4{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.clamp4.open{display:block;-webkit-line-clamp:unset;overflow:visible}
.dd .cv{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.dd[open]>summary .cv{transform:rotate(180deg)}
.dd[open]>summary{border-bottom:1px solid var(--line)}
.ddf{display:flex;justify-content:flex-end;padding:4px 8px 8px}
.lnk{background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;min-height:36px;padding:4px 10px;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.row.mute{cursor:default}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.row .nm{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.25}
.row .nm .mute{font-weight:400;font-size:12.5px;margin-top:2px}
.chip{font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:999px;color:#fff;flex:none}
.chip.l1{color:#2b2000}
.adwrap{margin-top:22px}
.adlab{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 4px 6px}
.ads{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--rad);box-shadow:var(--sh);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ads::-webkit-scrollbar{display:none}
.ad{flex:0 0 100%;scroll-snap-align:center;position:relative;aspect-ratio:16/8;min-height:140px;color:#fff;text-decoration:none;display:flex;align-items:flex-end;overflow:hidden}
.ad img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.adt{position:relative;width:100%;padding:36px 16px 14px;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}
.adt b{display:block;font-size:19px;line-height:1.2}.adt span{font-size:13.5px;opacity:.9}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .2s}
.dots i.on{width:20px;border-radius:4px;background:var(--acc)}
.inst{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:6px 14px;font-size:14px;border-radius:999px}
.inst svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet h3{margin:0 0 12px;font-size:19px;font-weight:800}
.sheet ol{margin:0 0 16px;padding-left:22px}.sheet li{margin:8px 0}
@media (min-width:720px){.sheetbg{align-items:center}.sheet{border-radius:22px}}

/* ===== Design écran mobile : fond noir autour du contenu, extérieur blanc ===== */
:root:root:root{color-scheme:dark;--bg:#000;--card:#14191E;--ink:#E9EDEF;--mute:#9AA6AE;--line:#262E35;--main:#3A5B78;--g:#46B982;--y:#F2B91F;--r:#EE6A6A;--soft:#1E262C;--acc:#F2B91F;--sh:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.4)}
html{background:#fff}
:root{--w:430px}
@media (min-width:721px){:root{--w:680px}}
body{background:#000;max-width:var(--w);margin:0 auto;min-height:100vh;position:relative}
nav{left:50%;right:auto;width:100%;max-width:var(--w);transform:translateX(-50%);background:#0B0E11;border-top:1px solid var(--line);box-shadow:none}
.sheetbg{left:50%;right:auto;width:100%;max-width:var(--w);transform:translateX(-50%)}
.top{box-shadow:0 2px 14px rgba(0,0,0,.6)}
@media (min-width:521px){
 body::after{content:"";position:fixed;z-index:100;top:0;bottom:0;left:50%;width:100%;max-width:var(--w);transform:translateX(-50%);border-radius:34px;box-shadow:0 0 0 200vmax #fff;pointer-events:none}
 body::before{content:"";position:fixed;z-index:101;top:7px;bottom:7px;left:50%;width:calc(100% - 14px);max-width:calc(var(--w) - 14px);transform:translateX(-50%);border-radius:27px;border:1px solid rgba(255,255,255,.85);pointer-events:none}
 .top{padding-top:calc(14px + env(safe-area-inset-top,0px))}
 nav{padding-bottom:6px}
 body{padding-bottom:82px}
}
@media (min-width:521px) and (max-width:720px){
 .top-in{flex-wrap:nowrap}.top .btn{min-height:40px;padding:0 12px;font-size:14px}.authbar{gap:6px}.brand .sub{display:none}h1{font-size:18px}.logo{width:36px;height:36px}
 .seg .a{padding:8px 8px 8px 0}.seg .a button{min-height:38px;padding:6px 12px;font-size:13px;width:100%}
 .list{grid-template-columns:1fr}
 .big{grid-template-columns:1fr}.big button{flex-direction:row;text-align:left;justify-content:flex-start}
 .grid2{grid-template-columns:1fr 1fr}
 main{padding:6px 16px 24px}
 .sheetbg{align-items:flex-end}.sheet{border-radius:22px 22px 0 0}
}
.hw{display:none}
@media (min-width:521px){
 .hw{display:block;position:fixed;z-index:102;left:50%;top:0;bottom:0;width:6px;margin-left:calc(var(--w)/2 - 1px);pointer-events:none}
 .hw i{position:absolute;left:0;width:6px;background:#000;border-radius:0 4px 4px 0}
 .hw i:nth-child(1){top:20%;height:46px}
 .hw i:nth-child(2){top:calc(20% + 58px);height:46px}
 .hw i:nth-child(3){top:calc(20% + 150px);height:78px}
}
.side{display:none}
@media (min-width:1280px){
 .side{display:flex;flex-direction:column;gap:14px;position:fixed;z-index:103;top:50%;transform:translateY(-50%);width:220px;color:#1B2024}
 .side.l{right:calc(50% + var(--w)/2 + 32px)}
 .side.r{left:calc(50% + var(--w)/2 + 32px)}
 .side h2{margin:0;font-size:26px;line-height:1.1}
 .side h3{margin:0;font-size:16px;font-weight:800}
 .side p{margin:0;font-size:14.5px;line-height:1.45;color:#4B555E}
 .side .sl{display:flex;align-items:center;gap:10px}
 .side .sl .logo{background:#1B2B3A}
 .side ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;font-weight:600}
 .side li{display:flex;align-items:center;gap:8px}
 .side li i{width:12px;height:12px;border-radius:50%;flex:none}
 .qr{background:#fff;border:1px solid #E3E5DF;border-radius:16px;padding:12px;width:164px;height:164px;display:grid;place-items:center;box-shadow:0 6px 18px rgba(20,30,40,.08)}
 .qr svg{width:100%;height:100%;display:block}
 .side button{align-self:flex-start}
}
.bdg{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#C93C3C;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}

/* en-tête : marque à gauche, cloche au milieu, menu à droite */
.top-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;flex-wrap:nowrap}
.top .brand{min-width:0}.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.authbar{justify-self:end;position:relative}
.ibtn{position:relative;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28)}
.ibtn.on{background:rgba(255,255,255,.3)}
.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn .bdg{top:-4px;right:-4px;left:auto;min-width:19px;height:19px;border:2px solid var(--main);box-sizing:content-box;pointer-events:none}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}}
.ibtn.ring svg{animation:ring .9s ease-in-out;transform-origin:50% 10%}
@media (prefers-reduced-motion:reduce){.ibtn.ring svg{animation:none}}

/* alertes de la cloche : celles des tronçons et stations suivis passent en premier dans chaque catégorie et restent ; les autres s’effacent seules après 3 h */
var AL_TTL=3*3600000;
function alFol(a){if(a.seg!==undefined&&a.seg!==null)return S.watch.indexOf(Number(a.seg))>=0;if(a.st!==undefined&&a.st!==null)return S.fwatch.indexOf(String(a.st))>=0;return (a.k||'suivi')==='suivi'}
function purgeAlerts(){var n=Date.now(),b=S.alerts.length;S.alerts=S.alerts.filter(function(a){return alFol(a)||!a.ts||n-a.ts<AL_TTL});if(S.alerts.length!==b){saveAlerts();return true}return false}
function pushAlert(a){if(!a.ts)a.ts=Date.now();S.alerts.unshift(a);purgeAlerts();S.alerts=S.alerts.slice(0,30);saveAlerts();notify(a);ringBell()}

/* demandes de disponibilité d’essence (onglet Essence) */
function fopenReq(id){var rs=(window.FREQ||[]).filter(function(q){return q.st===id&&Date.now()-q.t<45*MIN&&!mine(q)});if(!rs.length)return null;var t=Math.max.apply(null,rs.map(function(q){return q.t}));
 return (window.FREP||[]).some(function(r){return r.st===id&&r.t>t})?null:t}

function alKind(k){purgeAlerts();return S.alerts.map(function(a,i){return {a:a,i:i}}).filter(function(o){return (o.a.k||'suivi')===k}).sort(function(x,y){var fx=alFol(x.a)?1:0,fy=alFol(y.a)?1:0;return fy-fx||x.i-y.i})}
function alertN(){purgeAlerts();return S.alerts.length+reqList().length+freqList().length}
function delAlert(i){S.alerts.splice(i,1);saveAlerts();render()}
function delReq(k){DIS[k]=Date.now();saveDis();render()}
function clearKind(k){if(k==='demande')reqList().forEach(function(q){DIS[q.seg+':'+q.t]=Date.now()});else if(k==='essence')freqList().forEach(function(q){DIS['f'+q.st+':'+q.t]=Date.now()});else S.alerts=S.alerts.filter(function(a){return (a.k||'suivi')!==k});saveAlerts();saveDis();render()}

function playTone(name){var ac=audio();if(!ac)return;var t=TONES[name]||TONES[PR.tone]||TONES.cloche,now=ac.currentTime;
 t.seq.forEach(function(s){var o=ac.createOscillator(),g=ac.createGain(),a=Math.max(.001,PR.vol*.5);o.type=t.type;o.frequency.value=s[0];

/* administrateur : notes (étoiles) envoyées par les utilisateurs, lues dans la table app_ratings (accès réservé par is_admin()) */
function openRatings(){var c=window.sbClient;if(!window.ADMIN||!c)return;openSheet('Évaluations de l’app','<div id="rtc" class="mute" aria-live="polite">Chargement…</div>');
 c.from('app_ratings').select('stars,created_at').order('created_at',{ascending:false}).limit(1000).then(function(r){var el=document.getElementById('rtc');if(!el)return;
  if(r.error){el.textContent='Impossible de charger les notes.';return}
  var d=r.data||[],n=d.length;if(!n){el.textContent='Aucune note pour le moment.';return}
  var cnt=[0,0,0,0,0],sum=0,now=Date.now(),n30=0,s30=0;
  d.forEach(function(x){var v=+x.stars;if(v<1||v>5)return;cnt[v-1]++;sum+=v;if(now-new Date(x.created_at).getTime()<30*864e5){n30++;s30+=v}});
  var f1=function(x){return x.toFixed(1).replace('.',',')},rd=Math.round(sum/n),st='';for(var k=1;k<=5;k++)st+=k<=rd?'★':'☆';
  var h='<div style="text-align:center"><div style="font-size:42px;font-weight:800;line-height:1">'+f1(sum/n)+'<span style="font-size:20px"> / 5</span></div><div style="color:var(--acc,#F2B91F);font-size:24px;margin-top:4px" aria-hidden="true">'+st+'</div><div class="mute">'+n+' note'+(n>1?'s':'')+(n===1000?' (les 1 000 plus récentes)':'')+(n30?' · 30 derniers jours : '+f1(s30/n30)+' ('+n30+')':'')+'</div></div>';
  for(var j=5;j>=1;j--){var pc=Math.round(cnt[j-1]*100/n);h+='<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><span style="width:30px">'+j+' ★</span><div style="flex:1;height:10px;border-radius:5px;background:var(--soft)"><div style="width:'+pc+'%;height:100%;border-radius:5px;background:var(--acc,#F2B91F)"></div></div><span class="mute" style="width:78px;text-align:right">'+cnt[j-1]+' ('+pc+' %)</span></div>'}
  el.className='';el.innerHTML=h},function(){var el=document.getElementById('rtc');if(el)el.textContent='Impossible de charger les notes.'})}

function togglePush(){
 if(PUSHBUSY)return;
 if(PUSHON){PUSHON=false;PUSHBUSY=true;openSettings();render();toast('Notifications désactivées');window.pushOff().then(function(){PUSHBUSY=false},function(){PUSHBUSY=false});return}

function avPick(inp){var f=inp.files&&inp.files[0],u=window.CURU;if(!f||!u)return;if(!/^image\//.test(f.type)){toast('Choisissez une image');return}

/* ===== Points, niveaux, badges et classement des zones =====
   Tout est calculé par la base (déclencheurs et fonctions Supabase) : l'app ne fait que lire et afficher.

var ME=null,ZR=null,BD={tab:'me'},MEK='trafik-pts',LVL_ICO=['🌱','🔦','🛡️','🏅','🏆'];
function lvPct(l,p){if(!l.next_min)return 100;return Math.max(0,Math.min(100,Math.round((p-l.min)/(l.next_min-l.min)*100)))}
function lvTxt(l,p){var r=l.next_min-p;return l.next_min?r+' point'+(r>1?'s':'')+' avant '+esc(l.next_name):'Niveau maximum atteint'}
function lvBar(l,p){var v=lvPct(l,p);return '<div class="lvb" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+v+'" aria-label="Progression vers le niveau suivant"><i style="width:'+v+'%"></i></div>'}

function meCompare(d){try{var uid=window.UID,codes=d.badges.filter(function(b){return b.earned}).map(function(b){return b.code}),s=JSON.parse(localStorage.getItem(MEK)||'null');
 localStorage.setItem(MEK,JSON.stringify({u:uid,p:d.points,v:d.validated,pr:d.proposals,lv:d.level.n,b:codes}));
 if(!s||s.u!==uid||d.admin)return;
 var msg=[],gain=d.points-s.p;
 if(d.validated>s.v)msg.push('Votre signalement a été validé par la communauté (+'+gain+' point'+(gain>1?'s':'')+')');
 else if(d.proposals>s.pr)msg.push('Votre proposition a été publiée : merci ! (+'+gain+' points)');
 if(d.level.n>s.lv)msg.push('🏆 Nouveau niveau : '+esc(d.level.name));
 d.badges.forEach(function(b){if(b.earned&&(s.b||[]).indexOf(b.code)<0)msg.push(esc(b.icon)+' Nouveau badge : '+esc(b.name))});
 msg.forEach(function(t){pushAlert({t:hhmm(Date.now()),txt:t,l:0,k:'valide'});toast(dec(t))})}catch(e){}}
